latest:
  title: Latest news

blueprint_with_video:
  klass: home_video
  markdownContent: |
    <div class="feature-img">
      <iframe src="https://www.youtube.com/embed/4Ad1SCl0s6w"
              title="Introduction to DiSSCo Hellas"
              frameborder="0"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
              allowfullscreen>
      </iframe>
    </div>

    <div class="feature-content">
        <div class="feature-text">
            <h3 class="feature-title">
                <p>Digitising Greece’s Natural History Collections</p>
            </h3>
        </div>

        <div class="feature-description">
            <p>
               DiSSCo Hellas is unlocking the full potential of Greece’s natural history
               collections by making them digitally accessible and interoperable for all forms
               of research and innovation. The initiative brings together eight museums,
               coordinated by the Natural History Museum of Crete – University of Crete,
               as part of the European DiSSCo infrastructure.
            </p>
        </div>
        <div class="feature-cta">
            <a href="/assets/docs/DiSSCo_Hellas_Overview.pdf" class="button is-primary">
              Learn more
            </a>
        </div>
    </div>

main:
  klass: home_main
  markdownContent: |
    <script>
    // Simple REST‑based counters for a single dataset
    (async function() {
      const datasetKey = "6e73ce4f-628d-4317-8895-3ddb0d154c0b";

      async function fetchCount(url) {
        const response = await fetch(url);
        const data = await response.json();
        return data.count || 0;
      }

      try {
        const specimenCount = await fetchCount(
          `https://api.gbif.org/v1/occurrence/search?datasetKey=${datasetKey}&limit=0`
        );

        // This endpoint usually returns 1 for a single‑dataset publisher,
        // but we'll include it for consistency.
        const institutionCount = await fetchCount(
          `https://api.gbif.org/v1/institution/search?datasetKey=${datasetKey}&limit=0`
        );

        document.getElementById("home-feature-subtitle-rcount").textContent =
          specimenCount.toLocaleString("en");
        document.getElementById("home-feature-subtitle-icount").textContent =
          institutionCount;
        document.getElementById("home-feature-subtitle-nocount").style.display = "none";
        document.getElementById("home-feature-subtitle-count").style.display = "inline";
      } catch (error) {
        console.log("Error loading counts:", error);
      }
    })();

    function switchToSpecimens() {
      document.getElementById("home-search-form").action = "/specimen/search";
      document.getElementById("home-search-input").placeholder = "e.g. odonata";
      document.getElementById("home-tab-specimens").classList.add("is-primary");
      document.getElementById("home-tab-institutions").classList.remove("is-primary");
    }

    function switchToInstitutions() {
      document.getElementById("home-search-form").action = "/institution/search";
      document.getElementById("home-search-input").placeholder = "e.g. museum";
      document.getElementById("home-tab-institutions").classList.add("is-primary");
      document.getElementById("home-tab-specimens").classList.remove("is-primary");
    }
    </script>

    <div class="feature-img">
        <img src="/assets/images/sample_home.JPG">
        <div class="feature-img-license">
            <div class="feature-img-license-c">
                <span class="icon"><i class="fa fa-info-circle"></i></span>
            </div>
            <div class="feature-img-license-text">
                <p>© Natural History Museum of Crete – University of Crete</p>
            </div>
        </div>
    </div>

    <div class="feature-content">
        <h1 class="home-feature-title">The Distributed System of Scientific Collections – Greece</h1>
        <h2 class="home-feature-subtitle">
          <span id="home-feature-subtitle-nocount">
            Search Greek natural history collections
          </span>
          <span id="home-feature-subtitle-count">
            Search <span id="home-feature-subtitle-rcount"></span>
            records from <span id="home-feature-subtitle-icount"></span>
            Greek natural history collections
          </span>
        </h2>
        <div class="home-search-wrapper">
            <div class="home-search">
                <div class="home-tabs">
                    <div class="button is-primary" id="home-tab-specimens" onclick="switchToSpecimens()">
                        <span>Search specimens</span>
                    </div>
                    <div class="button" id="home-tab-institutions" onclick="switchToInstitutions()">
                        <span>Search institutions</span>
                    </div>
                </div>
                <form id="home-search-form" action="/specimen/search" method="GET">
                    <input type="search" name="q" id="home-search-input" value=""
                           autocomplete="off" placeholder="e.g. odonata">
                    <button type="submit">Search</button>
                </form>
            </div>
        </div>
    </div>
