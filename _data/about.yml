# data for the about page composed blocks

summary:
  description: |
    DiSSCo Hellas (Distributed System of Scientific Collections – Greece)
    is the national component of the European DiSSCo infrastructure.
    It unites and digitises the natural history collections of Greece,
    connecting data, people, and institutions through open and FAIR principles.
    
    Coordinated by the Natural History Museum of Crete – University of Crete,
    the initiative involves eight Natural History Museums across the country,
    working together to make millions of specimens digitally accessible
    for research, education, and society.
  cta:
    - text: Explore data
      isPrimary: true
      href: /specimen/search

map:
  background: /assets/images/dissco_map.png
  cta:
    - text: Download project outline
      href: /assets/docs/DiSSCo_Hellas_Overview.pdf
      isPrimary: true
  description: |
    DiSSCo Hellas aims to become a one‑stop, dynamic and openly available
    e‑science infrastructure integrating digital access to Greek natural history
    collections.  
    Through national and regional digitisation efforts DiSSCo Hellas will:
      - Empower the Greek network of collections through digitisation  
      - Enhance Greek biodiversity and heritage information infrastructure  
      - Improve data quality and interoperability  
      - Deliver relevant, open, and FAIR data  

benefits:
  markdownContent: |
    # Benefits of Greek natural science collections
    
    ## Scientific Benefits
    Greek Natural History collections are a vital resource for understanding
    biodiversity, evolution, geology, and ecology in the Eastern Mediterranean.
    Digitised specimens contribute directly to research on climate change,
    conservation, sustainable use of natural resources, and bio‑geography.

    ## Societal Benefits
    Collections connect museums with the public, strengthen education and
    inspire curiosity about the natural world. Shared digital resources make
    heritage accessible to schools, universities, and citizens across Greece.

    ## Economic Benefits
    Investments in digitisation amplify research capacity, foster innovation,
    and support green‑economy policies by making biodiversity data usable
    in decision‑making and sustainable development.

data:
  klass: about-data
  title: DiSSCo Hellas Data
  description: |
    DiSSCo Hellas adopts established international data standards and services
    from GBIF and the wider DiSSCo EU infrastructure.  
    All generated data follow the FAIR principles
    – Findable, Accessible, Interoperable, and Reusable –
    ensuring long‑term value for science and society.
  background: /assets/images/about/fossil.png
  reverse: true

