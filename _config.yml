# ---------------------------------------------------------------------------
#  DiSSCo Hellas – configuration file
#  Adapted from GBIF hp‑uk‑collections template
# ---------------------------------------------------------------------------

title: DiSSCo Hellas        # site title
email: info@nhmc.uoc.gr     # contact email for site correspondence
description: >-
  The Digital Specimen System for Greece (DiSSCo Hellas). 
  A collaborative portal uniting the collections of Natural History Museums 
  across Greece under the DiSSCo infrastructure.

baseurl: ""                 # empty unless hosted under a sub‑path
url: "http://147.52.206.110:4001"     # temporary public base URL for local testing

twitter_username: ""        # fill in later if desired
github_username: "DiSSCoHellas"       # optional organisation name

# Build settings ------------------------------------------------------------
theme: minima
plugins:
  - jekyll-feed
  - jekyll-remote-theme

remote_theme: gbif/jekyll-hp-base-theme

# ---------------------------------------------------------------------------
#  Privacy & analytics information
# ---------------------------------------------------------------------------
privacy:
  name: Natural History Museum of Crete – University of Crete
  domain: nhmc.uoc.gr
  contactEmail: info@nhmc.uoc.gr
  helpdeskEmail: support@nhmc.uoc.gr

siteMeasurements:
  enable: false             # set to true once you configure analytics
  GA_ID: ""                 # Google Analytics ID if/when used
  termsVersion: "2024‑01‑01"

# ---------------------------------------------------------------------------
#  Theme customisation
# ---------------------------------------------------------------------------

algae:
  rootLang: en
#  logo: /assets/images/logo/logo.svg
  logo: /assets/images/logo/transparent.png
#  logoAndTitle: false
  logoAndTitle: true
  archive_permalink: /news/
  style:
    colors:
#      primary: "#295077"    # DiSSCo blue
      primary: "#ea7a1d"    # DiSSCo orange
    coloredHeadlineLinks: false
  navbar:
#    brand: false
    # You can customise colours later if desired
    # color: "#295077"
    # hasWhiteText: true

# ---------------------------------------------------------------------------
#  GBIF API and data source configuration
#  For initial testing we retrieve all Greek collections registered in GBIF.
#  Later, replace 'country=GR' with a specific NHMC institutionKey or datasetKey.
# ---------------------------------------------------------------------------
collectionsSearch:
  filter: datasetKey=6e73ce4f-628d-4317-8895-3ddb0d154c0b
#  filter: country=GR

# ---------------------------------------------------------------------------
#  Miscellaneous Jekyll settings
# ---------------------------------------------------------------------------

exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - .LICENSE
  - .netlify.toml
  - .README.md

permalink: pretty

defaults:
  - scope:
      path: ""
    values:
      layout: "page"
      lang: en
  - scope:
      path: "_posts"
    values:
      layout: "post"
      permalink: "/post/:year/:slug/"
  - scope:
      path: "el/"           # placeholder for future Greek‑language pages
    values:
      lang: el

data_dir: _data
